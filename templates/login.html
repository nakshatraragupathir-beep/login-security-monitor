<!DOCTYPE html>
<html>
<head>
    <title>Login Security Monitoring</title>
</head>

<body>

    <h1>Login Security Monitoring System</h1>

    <form method="POST">

        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <h3>{{ message }}</h3>

</body>
</html>
